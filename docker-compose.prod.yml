# PM4Moodle — deployment for a single public host (DSV server).
#
#   cp .env.prod.example .env.prod      # then edit the passwords
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
# Everything is served from ONE container port under two paths:
#
#   https://pm4moodle.dsv.su.se/pm4moodle   PM4Moodle UI (API under /pm4moodle/api)
#   https://pm4moodle.dsv.su.se/moodle      live Moodle
#
# The outer, TLS-terminating reverse proxy should forward *everything* to the
# published port (8080 by default) WITHOUT rewriting the path, preserving the
# Host header and setting X-Forwarded-Proto. All path routing happens in the
# bundled `proxy` service below. See DEPLOY.md.
#
# Prerequisite: docker/moodle-dist/moodle-src.tar.gz must be present.
# See DOCKER_DEMO.md, Step A (it is gitignored, so it is not in the clone).

name: pm4moodle-prod

services:
  db:
    image: mariadb:10.11
    container_name: pm4moodle-prod-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env.prod}
      MARIADB_DATABASE: moodle
      MARIADB_USER: pm4moodle
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
    # Deliberately no published port: the database is reachable only from the
    # other containers on the internal network, never from the internet.
    volumes:
      # Imported once, when the data volume is first created.
      - ./test_dataset/backup.sql:/docker-entrypoint-initdb.d/01-backup.sql:ro
      - pm4moodle-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 60

  backend:
    build: ./backend
    container_name: pm4moodle-prod-backend
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: moodle
      DB_USER: pm4moodle
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
    expose:
      - "5000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        # Both are baked into the static build, so they must be correct here.
        # VITE_BASE_PATH  -> where the app is served from (asset + router paths)
        # VITE_API_BASE_URL -> relative, so it works on any hostname and needs no CORS
        VITE_BASE_PATH: /pm4moodle/
        VITE_API_BASE_URL: /pm4moodle/api
    container_name: pm4moodle-prod-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend

  moodle:
    image: moodlehq/moodle-php-apache:8.3
    container_name: pm4moodle-prod-moodle
    restart: unless-stopped
    environment:
      APACHE_DOCUMENT_ROOT: /var/www/html
      MOODLE_DBTYPE: mariadb
      MOODLE_DB_HOST: db
      MOODLE_DB_PORT: "3306"
      MOODLE_DB_NAME: moodle
      MOODLE_DB_USER: pm4moodle
      MOODLE_DB_PASS: ${DB_PASSWORD:?set DB_PASSWORD in .env.prod}
      # Moodle is installed into a real subdirectory so the URL the browser asks
      # for matches $CFG->wwwroot exactly. This is Moodle's normal "installed in
      # a subfolder" layout and avoids the path-rewriting problems that occur
      # when a proxy strips the prefix.
      MOODLE_SUBDIR: /moodle
      MOODLE_WWWROOT: ${PUBLIC_BASE_URL:?set PUBLIC_BASE_URL in .env.prod}/moodle
      # TLS is terminated by the outer proxy; without this Moodle would build
      # http:// links and redirect-loop. Derived from the wwwroot scheme, but
      # set explicitly here for clarity.
      MOODLE_SSLPROXY: "true"
      MOODLE_ADMIN_USER: ${MOODLE_ADMIN_USER:-admin}
      MOODLE_ADMIN_PASSWORD: ${MOODLE_ADMIN_PASSWORD:?set MOODLE_ADMIN_PASSWORD in .env.prod}
    volumes:
      - ./docker/moodle-dist:/opt/moodle-dist:ro
      - ./docker/empty-moodle-src:/opt/moodle-src:ro
      - ./docker/empty-moodledata:/opt/moodledata-src:ro
      - moodle-html:/var/www/html
      - moodle-moodledata:/var/www/moodledata
      - ./docker/moodle-entrypoint.sh:/usr/local/bin/pm4moodle-entrypoint.sh:ro
    entrypoint: ["bash", "/usr/local/bin/pm4moodle-entrypoint.sh"]
    expose:
      - "80"
    depends_on:
      db:
        condition: service_healthy

  proxy:
    image: nginx:alpine
    container_name: pm4moodle-prod-proxy
    restart: unless-stopped
    volumes:
      - ./docker/nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      # Bind to localhost only: the outer reverse proxy runs on the same host.
      # Change to "${PUBLIC_PORT:-8080}:80" if it runs elsewhere.
      - "127.0.0.1:${PUBLIC_PORT:-8080}:80"
    depends_on:
      - frontend
      - backend
      - moodle

volumes:
  pm4moodle-db-data:
  moodle-html:
  moodle-moodledata:
