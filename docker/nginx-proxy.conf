# Internal path router for the PM4Moodle deployment (docker-compose.prod.yml).
#
# It receives the ORIGINAL request path from the outer, TLS-terminating proxy
# and fans it out to the three services:
#
#   /pm4moodle/api/...     -> backend  (Flask, routes are /api/...)
#   /pm4moodle/output/...  -> backend  (generated OCEL JSON and OC-DFG PNG)
#   /pm4moodle/...         -> frontend (static SPA, built with base /pm4moodle/)
#   /moodle/...            -> moodle   (installed in /var/www/html/moodle)
#
# The outer proxy therefore needs no path rewriting at all.

# Honour the scheme the outer proxy terminated; fall back to our own if the
# header is absent (e.g. when testing this container directly).
map $http_x_forwarded_proto $pm4m_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Tell Flask which prefix it is mounted under, so url_for(..., _external=True)
# produces download links the browser can actually follow. Empty for everything
# else, and nginx omits a header whose value is empty.
map $uri $pm4m_prefix {
    default          "";
    "~^/pm4moodle/"  /pm4moodle;
}

server {
    listen 80;
    server_name _;

    # Emit relative Location headers. By default nginx expands "return 302 /x"
    # into an absolute URL built from the incoming Host header, so an outer
    # proxy that forwards to 127.0.0.1:8080 without preserving Host would send
    # testers to http://localhost:8080/... Relative redirects are resolved by
    # the browser against the address it actually asked for, which is correct
    # whatever the outer proxy does.
    absolute_redirect off;

    # The OCEL log is a few MB; give uploads and downloads room.
    client_max_body_size 64m;

    # An extraction takes about a minute, occasionally two. The default 60s
    # would cut it off and show the tester a 504.
    proxy_connect_timeout 15s;
    proxy_send_timeout    600s;
    proxy_read_timeout    600s;

    proxy_http_version 1.1;
    proxy_set_header Host               $host;
    proxy_set_header X-Real-IP          $remote_addr;
    proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto  $pm4m_proto;
    proxy_set_header X-Forwarded-Host   $host;
    proxy_set_header X-Forwarded-Prefix $pm4m_prefix;

    # Landing page: send the bare host to the tool.
    location = /          { return 302 /pm4moodle/; }
    location = /pm4moodle { return 302 /pm4moodle/; }
    location = /moodle    { return 302 /moodle/; }

    # --- PM4Moodle backend -------------------------------------------------
    # Longest matching prefix wins, so these are chosen over /pm4moodle/ below.
    location /pm4moodle/api/ {
        proxy_pass http://backend:5000/api/;
    }

    location /pm4moodle/output/ {
        proxy_pass http://backend:5000/output/;
    }

    # Swagger UI (flasgger). Harmless to expose; drop this block to hide it.
    location /pm4moodle/apidocs/ {
        proxy_pass http://backend:5000/apidocs/;
    }

    location /pm4moodle/apispec_1.json {
        proxy_pass http://backend:5000/apispec_1.json;
    }

    # --- PM4Moodle frontend ------------------------------------------------
    # The prefix is stripped here: the SPA container serves from its own root,
    # and its assets were built with base=/pm4moodle/ so the browser asks for
    # the right URLs. Unknown paths fall back to index.html inside that
    # container, which is what makes /pm4moodle/preview/json work on reload.
    location /pm4moodle/ {
        proxy_pass http://frontend:80/;
    }

    # --- Moodle ------------------------------------------------------------
    # No trailing slash on proxy_pass: the /moodle prefix is passed through
    # unchanged, because Moodle is installed in a matching subdirectory.
    location /moodle/ {
        proxy_pass http://moodle:80;
    }
}
